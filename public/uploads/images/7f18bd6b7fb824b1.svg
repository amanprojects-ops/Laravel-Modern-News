<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="accentGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="400" cy="200" r="240" fill="url(#accentGlow)" />

  <!-- Center Decorative Icon Container -->
  <g transform="translate(400, 185)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="70" fill="rgba(30, 144, 255, 0.08)" stroke="rgba(30, 144, 255, 0.3)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(30, 144, 255, 0.1)" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- App Icon -->
    <rect x="-36" y="-36" width="72" height="72" rx="18" fill="url(#logoGrad)" />
    <text x="0" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  </g>

  <!-- Title Text -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">BLOG AMAN PROJECTS</text>
  </g>

  <!-- Text Badge -->
  <g transform="translate(400, 360)">
    <!-- Pill Badge -->
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(30, 144, 255, 0.15)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="2" text-anchor="middle">AMANPROJECTS.COM</text>
  </g>
</svg>
